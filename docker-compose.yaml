services:
  backend:
    build: ./backend
    image: angadkumar9/flask-backend:latest
    
    container_name: flask_backend
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    image: angadkumar9/express-frontend:latest
    container_name: express_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://git add .:5000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge